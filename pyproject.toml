[project]
name = "echofind"
version = "0.1.0"
description = "Submerged-person detection from public sonar data: raw echoes to an edge detector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "xarray>=2024.1",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "mlflow>=2.12",
]

[project.optional-dependencies]
sonar = ["echopype>=0.9"]
dl = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "onnx>=1.16", "onnxruntime>=1.18"]
edge = ["pybind11>=2.12"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echofind"]

# CPU-only PyTorch: the cloud VM and CI have no GPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
